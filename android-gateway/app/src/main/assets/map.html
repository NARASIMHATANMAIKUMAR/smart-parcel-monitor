<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; background: #0a0e17; }
    .leaflet-control-attribution { font-size: 8px !important; background: rgba(0,0,0,0.5) !important; color: #888 !important; }
    .leaflet-control-attribution a { color: #38bdf8 !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', {
      zoomControl: true,
      attributionControl: true
    }).setView([12.971598, 77.594562], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var marker = null;
    var circle = null;

    window.updateLocation = function(lat, lon, accuracy, isSecure) {
      if (!lat || !lon || isNaN(lat) || isNaN(lon)) return;
      var strokeColor = isSecure ? '#10b981' : '#ef4444';
      var fillColor = isSecure ? 'rgba(16, 185, 129, 0.35)' : 'rgba(239, 68, 68, 0.45)';
      var radius = accuracy || 15;

      var pos = [lat, lon];

      if (!marker) {
        marker = L.circleMarker(pos, {
          radius: 10,
          color: strokeColor,
          weight: 3,
          fillColor: fillColor,
          fillOpacity: 1
        }).addTo(map);

        circle = L.circle(pos, {
          radius: radius,
          color: strokeColor,
          weight: 1,
          fillColor: fillColor,
          fillOpacity: 0.15
        }).addTo(map);

        map.setView(pos, 16);
      } else {
        marker.setLatLng(pos);
        marker.setStyle({ color: strokeColor, fillColor: fillColor });
        if (circle) {
          circle.setLatLng(pos);
          circle.setRadius(radius);
          circle.setStyle({ color: strokeColor, fillColor: fillColor });
        }
        map.panTo(pos);
      }
    };
  </script>
</body>
</html>
